name: Deploy G-Blog to GitHub Pages

on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del generador
        run: pip install -r demo/scripts/requirements.txt

      # G-Blog: el sitio se arma desde demo/ (los artículos se regeneran desde docs/*.md).
      # Para activar el contador, crea la variable de repositorio GOATCOUNTER_CODE
      # (Settings → Secrets and variables → Actions → Variables).
      - name: Construir G-Blog
        run: python demo/scripts/construir_sitio.py --goatcounter "${{ vars.GOATCOUNTER_CODE }}"

      - name: Verificar archivos generados
        run: ls -la site

      - name: Subir artefactos de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4